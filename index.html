          ctx.save();
          ctx.globalAlpha = 0.11;
          ctx.fillStyle = P.fog;
          for (let x = 0; x <= game.map.cols; x++) {
            ctx.fillRect(x * TILE, 0, 1, MAP_H);
          }
          for (let y = 0; y <= game.map.rows; y++) {
            ctx.fillRect(0, y * TILE, MAP_W, 1);
          }
          ctx.restore();

          for (const rect of game.map.obstacleRects) {
            this.drawObstacle(rect);
          }

          ctx.strokeStyle = P.ink;
          ctx.lineWidth = 2;
          ctx.strokeRect(1, 1, MAP_W - 2, MAP_H - 2);
        }

        drawObstacle(rect) {
          const ctx = this.ctx;
          const x = rect.x * TILE;
          const y = rect.y * TILE;
          const width = rect.w * TILE;
          const height = rect.h * TILE;

          ctx.fillStyle = P.ink;
          ctx.fillRect(x + 2, y + 2, width, height);
          ctx.fillStyle = P.white;
          ctx.fillRect(x, y, width, height - 2);
          ctx.fillStyle = P.ink;
          ctx.fillRect(x, y, width, 5);
          ctx.fillStyle = P.orange;
          ctx.fillRect(x + 2, y + 2, Math.max(1, width - 4), 2);
          ctx.fillStyle = P.ink;
          ctx.fillRect(x, y + height - 3, width, 3);

          for (let bx = x + 7; bx < x + width; bx += 16) {
            for (let by = y + 8; by < y + height; by += 16) {
              ctx.fillStyle = P.ink;
              ctx.fillRect(bx, by, 3, 3);
              ctx.fillStyle = P.orange;
              ctx.fillRect(bx, by, 1, 1);
              ctx.fillStyle = P.white;
              ctx.fillRect(bx + 2, by + 2, 1, 1);
            }
          }
        }

        drawTraps() {
          const ctx = this.ctx;
          for (const trap of this.game.items.traps) {
            const armed = trap.armTime <= 0;
            const blink = !armed || Math.sin(this.renderTime * 9 + trap.id) > 0;
            const x = Math.round(trap.x);
            const y = Math.round(trap.y);
            ctx.fillStyle = P.ink;
            ctx.fillRect(x - 7, y - 5, 14, 10);
            ctx.fillStyle = blink ? (armed ? P.yellow : P.slate) : P.red;
            ctx.fillRect(x - 6, y - 4, 12, 8);
            ctx.fillStyle = P.ink;
            ctx.fillRect(x - 4, y - 2, 8, 4);
            ctx.fillStyle = teamColor(trap.team);
            ctx.fillRect(x - 7, y - 7, 3, 2);
            ctx.fillRect(x + 4, y + 5, 3, 2);
            if (armed) {
              ctx.fillStyle = P.red;
              ctx.fillRect(x - 1, y - 1, 2, 2);
            }
          }
        }

        drawCrates() {
          const ctx = this.ctx;
          for (const crate of this.game.items.crates) {
            const bob = Math.round(Math.sin(crate.age * 3.4 + crate.bobSeed) * 1.5);
            const x = Math.round(crate.x);
            const y = Math.round(crate.y) + bob;
            ctx.save();
            ctx.globalAlpha = 0.28;
            ctx.fillStyle = P.ink;
            ctx.fillRect(x - 6, y + 5, 12, 3);
            ctx.restore();

            ctx.fillStyle = P.ink;
            ctx.fillRect(x - 6, y - 6, 12, 12);
            ctx.fillStyle = crate.dropped ? P.red : P.brown;
            ctx.fillRect(x - 5, y - 5, 10, 10);
            ctx.fillStyle = P.yellow;
            ctx.fillRect(x - 5, y - 5, 10, 2);
            ctx.fillRect(x - 5, y + 3, 10, 2);
            ctx.fillStyle = P.cream;
            ctx.fillRect(x, y - 5, 2, 10);
            drawPixelText(ctx, "?", x + 1, y - 2, 1, P.ink, "center");
          }
        }

        drawDashGhosts() {
          const ctx = this.ctx;
          for (const ghost of this.game.effects.dashGhosts) {
            const ratio = ghost.life / ghost.maxLife;
            ctx.save();
            ctx.globalAlpha = ratio * 0.32;
            ctx.fillStyle = teamColor(ghost.team);
            ctx.fillRect(Math.round(ghost.x) - 5, Math.round(ghost.y) - 8, 10, 13);
            ctx.fillStyle = P.ink;
            ctx.fillRect(Math.round(ghost.x) - 3, Math.round(ghost.y) + 3, 8, 2);
            ctx.restore();
          }
        }

        drawFighters() {
          const sorted = [...this.game.fighters].sort((a, b) => a.y - b.y);
          for (const fighter of sorted) this.drawFighter(fighter);
        }

        drawFighter(fighter) {
          const ctx = this.ctx;
          const direction = this.directionIndex(fighter.aimAngle);
          const movingFrame = fighter.isMoving
            ? Math.floor(fighter.moveTime * 11) % 2
            : 0;
          const idleBob =
            !fighter.isMoving && !fighter.isStunned
              ? Math.sin(fighter.idleTime * 3.1) > 0.72 ? -1 : 0
              : 0;
          const x = Math.round(fighter.x);
          const y = Math.round(fighter.y);

          ctx.save();
          ctx.globalAlpha = 0.3;
          ctx.fillStyle = P.ink;
          ctx.fillRect(x - 7, y + 4, 14, 4);
          ctx.fillRect(x - 5, y + 7, 10, 2);
          ctx.restore();

          if (fighter.isDashing) {
            const dx = Math.cos(fighter.dashAngle);
            const dy = Math.sin(fighter.dashAngle);
            ctx.save();
            ctx.globalAlpha = 0.55;
            for (let i = 1; i <= 3; i++) {
              ctx.fillStyle = i === 1 ? teamColor(fighter.team) : P.ink;
              ctx.fillRect(
                Math.round(x - dx * i * 5) - 2,
                Math.round(y - dy * i * 5) - 2,
                i === 1 ? 4 : 2,
                i === 1 ? 4 : 2
              );
            }
            ctx.restore();
          }

          const sprite = this.sprites[fighter.team][direction][movingFrame];
          ctx.drawImage(sprite, x - 12, y - 17 + idleBob);

          if (fighter.inventory) {
            ctx.fillStyle = P.ink;
            ctx.fillRect(x + 7, y - 17, 10, 10);
            ctx.fillStyle = P.cream;
            ctx.fillRect(x + 8, y - 16, 8, 8);
            this.drawItemIcon(ctx, fighter.inventory.type, x + 9, y - 15, 6);
          }

          if (fighter.isStunned) this.drawStunStars(fighter);
          if (fighter.isRooted) this.drawRootStatus(fighter);

          const cooldownRatio = 1 - fighter.dashCooldown / CONFIG.fighter.dashCooldown;
          ctx.fillStyle = P.ink;
          ctx.fillRect(x - 6, y + 9, 12, 3);
          ctx.fillStyle = fighter.dashCooldown <= 0 ? P.yellow : teamColor(fighter.team);
          ctx.fillRect(x - 5, y + 10, Math.round(10 * clamp(cooldownRatio, 0, 1)), 1);

          const label = fighter === this.game.hero
            ? "YOU"
            : `AI${fighter.aiIndex || ""}`;
          const labelWidth = pixelTextWidth(label, 1);
          ctx.fillStyle = P.white;
          ctx.fillRect(x - Math.floor(labelWidth / 2) - 2, y - 25, labelWidth + 4, 7);
          drawPixelText(
            ctx,
            label,
            x,
            y - 24,
            1,
            teamColor(fighter.team),
            "center"
          );
        }

        drawStunStars(fighter) {
          const ctx = this.ctx;
          const x = Math.round(fighter.x);
          const y = Math.round(fighter.y) - 17;
          for (let i = 0; i < 3; i++) {
            const angle = this.renderTime * 5 + (i * Math.PI * 2) / 3;
            const sx = Math.round(x + Math.cos(angle) * 8);
            const sy = Math.round(y + Math.sin(angle) * 3);
            ctx.fillStyle = i === 0 ? P.red : P.yellow;
            ctx.fillRect(sx - 2, sy, 5, 1);
            ctx.fillRect(sx, sy - 2, 1, 5);
            ctx.fillStyle = P.ink;
            ctx.fillRect(sx, sy, 1, 1);
          }
        }

        drawRootStatus(fighter) {
          const ctx = this.ctx;
          const x = Math.round(fighter.x);
          const y = Math.round(fighter.y);
          ctx.fillStyle = P.yellow;
          ctx.fillRect(x - 8, y + 3, 4, 3);
          ctx.fillRect(x + 4, y + 3, 4, 3);
          ctx.fillStyle = P.red;
          ctx.fillRect(x - 7, y + 5, 3, 2);
          ctx.fillRect(x + 4, y + 5, 3, 2);
          ctx.fillStyle = P.ink;
          ctx.fillRect(x - 2, y + 4, 4, 2);
          drawPixelText(ctx, "X", x, y - 25, 1, P.red, "center");
        }

        drawProjectiles() {
          const ctx = this.ctx;
          for (const projectile of this.game.items.projectiles) {
            const dx = Math.cos(projectile.angle);
            const dy = Math.sin(projectile.angle);
            const x = Math.round(projectile.x);
            const y = Math.round(projectile.y);
            for (let i = 1; i <= 4; i++) {
              ctx.fillStyle = i < 3 ? teamColor(projectile.team) : P.cream;
              ctx.fillRect(
                Math.round(x - dx * i * 3) - 1,
                Math.round(y - dy * i * 3) - 1,
                i < 3 ? 2 : 1,
                i < 3 ? 2 : 1
              );
            }
            ctx.fillStyle = P.ink;
            ctx.fillRect(x - 2, y - 2, 4, 4);
            ctx.fillStyle = P.cream;
            ctx.fillRect(x - 1, y - 1, 2, 2);
            ctx.fillStyle = P.red;
            ctx.fillRect(Math.round(x + dx * 3) - 1, Math.round(y + dy * 3) - 1, 2, 2);
          }
        }

        drawEffects() {
          const ctx = this.ctx;

          for (const explosion of this.game.effects.explosions) {
            const progress = 1 - explosion.life / explosion.maxLife;
            const radius = CONFIG.items.missileAoeRadius * (0.35 + progress * 0.65);
            ctx.save();
            ctx.globalAlpha = 1 - progress;
            for (let i = 0; i < 14; i++) {
              const angle = (Math.PI * 2 * i) / 14;
              const px = Math.round(explosion.x + Math.cos(angle) * radius);
              const py = Math.round(explosion.y + Math.sin(angle) * radius);
              ctx.fillStyle = i % 3 === 0 ? P.cream : teamColor(explosion.team);
              ctx.fillRect(px - 1, py - 1, i % 2 === 0 ? 3 : 2, 3);
            }
            ctx.restore();
          }

          for (const swing of this.game.effects.hammerSwings) {
            const progress = 1 - swing.life / swing.maxLife;
            const radius = CONFIG.items.hammerRange * (0.6 + progress * 0.35);
            ctx.save();
            ctx.globalAlpha = 0.9 - progress * 0.55;
            for (let i = 0; i <= 10; i++) {
              const angle =
                swing.angle - CONFIG.items.hammerHalfAngle +
                (CONFIG.items.hammerHalfAngle * 2 * i) / 10;
              const sx = Math.round(swing.x + Math.cos(angle) * radius);
              const sy = Math.round(swing.y + Math.sin(angle) * radius);
              ctx.fillStyle = i % 2 === 0 ? teamColor(swing.team) : P.cream;
              ctx.fillRect(sx - 1, sy - 1, 3, 3);
            }
            ctx.restore();
          }

          for (const particle of this.game.effects.particles) {
            const alpha = clamp(particle.life / particle.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = particle.color;
            ctx.fillRect(
              Math.round(particle.x),
              Math.round(particle.y),
              particle.size,
              particle.size
            );
            ctx.restore();
          }

          for (const text of this.game.effects.floatingTexts) {
            ctx.save();
            ctx.globalAlpha = clamp(text.life / text.maxLife, 0, 1);
            drawPixelText(ctx, text.text, text.x, text.y, 1, text.color, "center");
            ctx.restore();
          }
        }

        drawAimReticle() {
          if (this.game.state !== "playing") return;
          const mouse = this.game.input.mouse;
          if (!mouse.inside) return;
          const x = Math.round(mouse.x);
          const y = Math.round(mouse.y - CONFIG.view.playOffsetY);
          const ctx = this.ctx;
          ctx.fillStyle = P.ink;
          ctx.fillRect(x - 5, y - 1, 10, 3);
          ctx.fillRect(x - 1, y - 5, 3, 10);
          ctx.fillStyle = P.orange;
          ctx.fillRect(x - 4, y, 2, 1);
          ctx.fillRect(x + 3, y, 2, 1);
          ctx.fillRect(x, y - 4, 1, 2);
          ctx.fillRect(x, y + 3, 1, 2);
          ctx.fillStyle = P.cream;
          ctx.fillRect(x, y, 1, 1);
        }

        drawItemIcon(ctx, type, x, y, size = 12) {
          if (!type) {
            ctx.fillStyle = P.slate;
            ctx.fillRect(x + 2, y + size / 2, size - 4, 1);
            return;
          }

          ctx.save();
          ctx.translate(x, y);
          ctx.scale(size / 12, size / 12);
          if (type === "hammer") {
            ctx.fillStyle = P.ink;
            ctx.fillRect(5, 2, 2, 9);
            ctx.fillRect(1, 1, 10, 5);
            ctx.fillStyle = P.cream;
            ctx.fillRect(5, 3, 1, 7);
            ctx.fillStyle = P.slate;
            ctx.fillRect(2, 2, 8, 3);
            ctx.fillStyle = P.fog;
            ctx.fillRect(3, 2, 5, 1);
          } else if (type === "missile") {
            ctx.fillStyle = P.ink;
            ctx.fillRect(4, 3, 5, 7);
            ctx.fillRect(3, 9, 7, 2);
            ctx.fillStyle = P.cream;
            ctx.fillRect(5, 2, 3, 7);
            ctx.fillStyle = P.red;
            ctx.fillRect(5, 1, 3, 2);
            ctx.fillStyle = P.yellow;
            ctx.fillRect(4, 10, 1, 2);
            ctx.fillRect(7, 10, 1, 2);
          } else {
            ctx.fillStyle = P.ink;
            ctx.fillRect(1, 5, 10, 5);
            ctx.fillStyle = P.yellow;
            ctx.fillRect(2, 5, 8, 2);
            ctx.fillRect(2, 9, 8, 1);
            ctx.fillStyle = P.ink;
            ctx.fillRect(3, 4, 1, 3);
            ctx.fillRect(6, 4, 1, 3);
            ctx.fillRect(9, 4, 1, 3);
            ctx.fillStyle = P.red;
            ctx.fillRect(5, 6, 2, 2);
          }
          ctx.restore();
        }

        drawProgressBar(x, y, width, percent, color, reverse = false) {
          const ctx = this.ctx;
          const safePercent = clamp(percent, 0, 100);
          ctx.fillStyle = P.ink;
          ctx.fillRect(x - 1, y - 1, width + 2, 8);
          ctx.fillStyle = P.fog;
          ctx.fillRect(x, y, width, 6);
          const fillWidth = Math.round(width * safePercent / 100);
          ctx.fillStyle = color;
          if (reverse) {
            ctx.fillRect(x + width - fillWidth, y, fillWidth, 6);
          } else {
            ctx.fillRect(x, y, fillWidth, 6);
          }
          ctx.fillStyle = P.cream;
          if (fillWidth > 0) {
            ctx.fillRect(reverse ? x + width - fillWidth : x, y, fillWidth, 1);
          }
        }

        drawHud() {
          const ctx = this.ctx;
          const game = this.game;
          const coverage = game.coverage || {
            orangePercent: 0,
            bluePercent: 0,
            limePercent: 0
          };
          const orangeText = `ORANGE ${formatInteger(coverage.orangePercent, 3)}%`;
          const blueText = `BLUE ${formatInteger(coverage.bluePercent, 3)}%`;
          const limeText = `LIME ${formatInteger(coverage.limePercent, 3)}%`;

          ctx.fillStyle = P.ink;
          ctx.fillRect(0, 0, CONFIG.view.width, CONFIG.view.playOffsetY);
          ctx.fillStyle = P.slate;
          ctx.fillRect(0, CONFIG.view.playOffsetY - 1, CONFIG.view.width, 1);

          drawPixelText(ctx, orangeText, 5, 4, 1, P.orange);
          drawPixelText(ctx, blueText, 166, 4, 1, P.white);
          drawPixelText(ctx, limeText, 475, 4, 1, P.lime, "right");

          const lowTime = game.matchTime <= 10;
          const pulse = lowTime
            ? (Math.sin(this.renderTime * 8) > 0 ? P.orange : P.white)
            : P.cream;
          drawPixelText(ctx, formatTime(game.matchTime), 240, 3, 2, pulse, "center");
          drawPixelText(ctx, "TIME", 240, 13, 1, P.fog, "center");

          this.drawProgressBar(5, 21, 150, coverage.orangePercent, P.orange, false);
          this.drawProgressBar(165, 21, 150, coverage.bluePercent, P.blue, false);
          this.drawProgressBar(325, 21, 150, coverage.limePercent, P.lime, false);

          this.drawBottomHud();
          this.drawNotice();
        }

        drawBottomHud() {
          const ctx = this.ctx;
          const hero = this.game.hero;
          if (!hero) return;
          const panelY = CONFIG.view.height - 20;

          ctx.fillStyle = P.ink;
          ctx.fillRect(4, panelY, 154, 17);
          ctx.fillStyle = P.slate;
          ctx.fillRect(4, panelY, 154, 1);
          ctx.fillRect(4, panelY + 16, 154, 1);

          ctx.fillStyle = P.cream;
          ctx.fillRect(7, panelY + 2, 13, 13);
          ctx.fillStyle = P.ink;
          ctx.fillRect(8, panelY + 3, 11, 11);
          this.drawItemIcon(
            ctx,
            hero.inventory ? hero.inventory.type : null,
            8,
            panelY + 3,
            11
          );

          const itemName = hero.inventory
            ? hero.inventory.type === "hammer"
              ? "HAMMER"
              : hero.inventory.type === "missile"
                ? "MISSILE"
                : "TRAP"
            : "EMPTY";
          drawPixelText(ctx, itemName, 24, panelY + 6, 1, hero.inventory ? P.yellow : P.fog);

          drawPixelText(ctx, "DASH", 86, panelY + 3, 1, P.fog);
          ctx.fillStyle = P.slate;
          ctx.fillRect(86, panelY + 11, 65, 3);
          const ready = hero.dashCooldown <= 0;
          const ratio = 1 - hero.dashCooldown / CONFIG.fighter.dashCooldown;
          ctx.fillStyle = ready ? P.yellow : P.orange;
          ctx.fillRect(86, panelY + 11, Math.round(65 * clamp(ratio, 0, 1)), 3);

          if (hero.isStunned) {
            this.drawStatusChip(
              `STUN ${hero.status.time.toFixed(1)}`,
              P.red
            );
          } else if (hero.isRooted) {
            this.drawStatusChip(
              `ROOT ${hero.status.time.toFixed(1)}`,
              P.yellow
            );
          } else if (hero.inventory && hero.itemCooldown > 0) {
            this.drawStatusChip(`ITEM CD ${hero.itemCooldown.toFixed(1)}`, P.fog);
          }
        }

        drawStatusChip(text, color) {
          const ctx = this.ctx;
          const width = pixelTextWidth(text, 1) + 10;
          const x = CONFIG.view.width - width - 5;
          const y = CONFIG.view.height - 20;
          ctx.fillStyle = P.ink;
          ctx.fillRect(x, y, width, 17);
          ctx.fillStyle = color;
          ctx.fillRect(x, y, width, 1);
          ctx.fillRect(x, y + 16, width, 1);
          drawPixelText(ctx, text, x + 5, y + 6, 1, color);
        }

        drawNotice() {
          if (!this.game.noticeText || this.game.noticeTime <= 0) return;
          const ctx = this.ctx;
          const alpha = clamp(this.game.noticeTime * 3, 0, 1);
          const width = pixelTextWidth(this.game.noticeText, 1) + 14;
          const x = CONFIG.view.width / 2;
          const y = CONFIG.view.playOffsetY + 6;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = P.ink;
          ctx.fillRect(Math.round(x - width / 2), y, width, 13);
          ctx.fillStyle = P.yellow;
          ctx.fillRect(Math.round(x - width / 2), y, width, 1);
          drawPixelText(ctx, this.game.noticeText, x, y + 4, 1, P.cream, "center");
          ctx.restore();
        }
      }

      // ============================================================
      // 11. Game：世界组装、输入解释与对局状态
      // ============================================================
      class Game {
        constructor(canvas, input) {
          this.canvas = canvas;
          this.input = input;
          this.gameFrame = document.getElementById("gameFrame");
          this.startOverlay = document.getElementById("startOverlay");
          this.pauseOverlay = document.getElementById("pauseOverlay");
          this.resultOverlay = document.getElementById("resultOverlay");
          this.resultTitle = document.getElementById("resultTitle");
          this.resultScore = document.getElementById("resultScore");
          this.resultNote = document.getElementById("resultNote");
          this.state = "ready";
          this.noticeText = "";
          this.noticeTime = 0;
          this.scale = 1;

          this.resetWorld();
          this.renderer = new Renderer(this, canvas);
          this.bindUI();
          this.resize();
        }

        resetWorld() {
          this.frame = 0;
          this.elapsed = 0;
          this.matchTime = CONFIG.matchDuration;
          this.noticeText = "";
          this.noticeTime = 0;
          this.map = new InkMap();
          this.effects = new Effects(this);
          this.items = null;

          this.hero = new Fighter(this, {
            id: "hero",
            team: 1,
            x: 46,
            y: 196,
            aimAngle: -0.2,
            name: "ORANGE"
          });

          const enemySpawns = [
            { x: 432, y: 44, aimAngle: Math.PI * 0.8 },
            { x: 432, y: 196, aimAngle: Math.PI * 1.2 }
          ];
          this.enemies = [];
          for (let i = 0; i < CONFIG.ai.count; i++) {
            const spawn = enemySpawns[i % enemySpawns.length];
            const fighter = new Fighter(this, {
              id: `ai-${i + 1}`,
              team: i === 0 ? 2 : 3,
              x: spawn.x,
              y: spawn.y,
              aimAngle: spawn.aimAngle,
              isAI: true,
              name: `AI ${i + 1}`
            });
            fighter.aiIndex = i + 1;
            this.enemies.push(fighter);
          }

          this.fighters = [this.hero, ...this.enemies];
          this.items = new ItemSystem(this);
          this.aiControllers = this.enemies.map(
            (fighter, index) => new AIController(this, fighter, index)
          );
          this.collision = new CollisionSystem(this);
          this.coverage = this.map.coverage();
        }

        bindUI() {
          document.getElementById("startButton").addEventListener("click", () => this.start());
          document.getElementById("resumeButton").addEventListener("click", () => this.resume());
          document.getElementById("restartButton").addEventListener("click", () => this.restart());

          window.addEventListener("keydown", (event) => {
            if (event.repeat) return;
            if (event.code === "Enter") {
              event.preventDefault();
              if (this.state === "ready" || this.state === "ended") this.restart();
            } else if (event.code === "KeyP" || event.code === "Escape") {
              event.preventDefault();
              if (this.state === "playing") this.pause();
              else if (this.state === "paused") this.resume();
            }
          });

          window.addEventListener("resize", () => this.resize());
          window.addEventListener("blur", () => {
            if (this.state === "playing") this.pause();
          });
          document.addEventListener("visibilitychange", () => {
            if (document.hidden && this.state === "playing") this.pause();
          });
        }

        resize() {
          const horizontalPadding = window.innerWidth < 720 ? 8 : 32;
          const verticalPadding = window.innerWidth < 720 ? 8 : 32;
          const fit = Math.min(
            (window.innerWidth - horizontalPadding) / CONFIG.view.width,
            (window.innerHeight - verticalPadding) / CONFIG.view.height
          );

          // 桌面端使用整数倍放大；极窄屏幕允许缩小以完整显示。
          this.scale = fit >= 1 ? Math.floor(fit) : Math.max(0.38, fit);
          this.gameFrame.style.setProperty("--scale", String(this.scale));
        }

        hideOverlays() {
          this.startOverlay.classList.add("hidden");
          this.pauseOverlay.classList.add("hidden");
          this.resultOverlay.classList.add("hidden");
        }

        start() {
          this.resetWorld();
          this.state = "playing";
          this.hideOverlays();
          this.input.endLogicFrame();
          this.canvas.focus({ preventScroll: true });
          this.notify("SPREAD YOUR INK!", 1.4);
        }

        restart() {
          this.start();
        }

        pause() {
          if (this.state !== "playing") return;
          this.state = "paused";
          this.pauseOverlay.classList.remove("hidden");
          this.input.endLogicFrame();
        }

        resume() {
          if (this.state !== "paused") return;
          this.state = "playing";
          this.pauseOverlay.classList.add("hidden");
          this.input.endLogicFrame();
          this.canvas.focus({ preventScroll: true });
        }

        endMatch() {
          if (this.state !== "playing") return;
          this.coverage = this.map.coverage();
          this.state = "ended";
          this.input.endLogicFrame();

          const orange = this.coverage.orangePercent;
          const blue = this.coverage.bluePercent;
          const lime = this.coverage.limePercent;
          const neutral = (this.coverage.neutral / this.map.paintableCount) * 100;
          const leaders = [
            { count: this.coverage.orange, title: "橙队胜利" },
            { count: this.coverage.blue, title: "蓝队胜利" },
            { count: this.coverage.lime, title: "绿队胜利" }
          ];
          const maxCount = Math.max(...leaders.map((entry) => entry.count));
          const winners = leaders.filter((entry) => entry.count === maxCount);

          if (winners.length === 1) {
            this.resultTitle.textContent = winners[0].title;
          } else {
            this.resultTitle.textContent = "平局";
          }
          this.resultScore.textContent =
            `ORANGE ${orange.toFixed(1)}%  /  BLUE ${blue.toFixed(1)}%  /  LIME ${lime.toFixed(1)}%`;
          this.resultNote.textContent =
            `未被覆盖的地面：${neutral.toFixed(1)}%。按 Enter 或点击按钮再战。`;
          this.resultOverlay.classList.remove("hidden");
        }

        notify(text, duration = 1.25) {
          this.noticeText = text;
          this.noticeTime = duration;
        }

        onDashStarted(fighter) {
          this.effects.spawnInkBurst(
            fighter.x - Math.cos(fighter.dashAngle) * 5,
            fighter.y - Math.sin(fighter.dashAngle) * 5,
            teamColor(fighter.team),
            3,
            25
          );
        }

        onFighterRecovered(fighter) {
          if (fighter !== this.hero) return;
          this.notify("CONTROL RECOVERED", 0.7);
        }

        getNearestEnemy(team, x, y) {
          let nearest = null;
          let nearestDistance = Infinity;
          for (const fighter of this.fighters) {
            if (fighter.team === team) continue;
            const dist = Math.hypot(fighter.x - x, fighter.y - y);
            if (dist < nearestDistance) {
              nearest = fighter;
              nearestDistance = dist;
            }
          }
          return nearest;
        }

        buildPlayerControls() {
          const move = this.input.getMovement();
          const arrowAim = this.input.getArrowAim();
          let aimAngle = this.hero.aimAngle;

          if (this.input.mouse.inside) {
            const worldMouseY = this.input.mouse.y - CONFIG.view.playOffsetY;
            const aimX = this.input.mouse.x - this.hero.x;
            const aimY = worldMouseY - this.hero.y;
            if (Math.hypot(aimX, aimY) > 1.5) {
              aimAngle = Math.atan2(aimY, aimX);
            }
          } else if (arrowAim.length > 0) {
            aimAngle = Math.atan2(arrowAim.y, arrowAim.x);
          } else if (move.length > 0) {
            aimAngle = Math.atan2(move.y, move.x);
          }

          return {
            moveX: move.x,
            moveY: move.y,
            aimAngle,
            dash: this.input.wasPressed("Space") || this.input.mousePressedThisFrame,
            itemUse: this.input.wasPressed("KeyE")
          };
        }

        update(dt) {
          if (this.state !== "playing") return;

          this.frame++;
          this.elapsed += dt;
          this.matchTime = Math.max(0, this.matchTime - dt);

          // 固定顺序：玩家 -> AI -> 道具 -> 碰撞结算 -> 表现。
          this.hero.update(dt, this.buildPlayerControls());
          for (const controller of this.aiControllers) controller.update(dt);
          this.items.update(dt);
          this.collision.update();
          this.effects.update(dt);
          this.coverage = this.map.coverage();

          this.input.endLogicFrame();
          if (this.matchTime <= 0) this.endMatch();
        }

        render() {
          this.renderer.render();
        }
      }

      // ============================================================
      // 12. GameLoop：固定 60Hz 逻辑更新，requestAnimationFrame 渲染
      // ============================================================
      class GameLoop {
        constructor(game) {
          this.game = game;
          this.accumulator = 0;
          this.lastTimestamp = 0;
          this.running = false;
          this.tick = this.tick.bind(this);
        }

        start() {
          if (this.running) return;
          this.running = true;
          this.lastTimestamp = performance.now();
          requestAnimationFrame(this.tick);
        }

        tick(timestamp) {
          const frameDelta = Math.min(
            (timestamp - this.lastTimestamp) / 1000,
            CONFIG.maxFrameDelta
          );
          this.lastTimestamp = timestamp;

          if (this.game.state === "playing") {
            this.accumulator += frameDelta;
            let updates = 0;
            while (this.accumulator >= CONFIG.fixedStep && updates < 8) {
              this.game.update(CONFIG.fixedStep);
              this.accumulator -= CONFIG.fixedStep;
              updates++;
            }
            if (updates >= 8) this.accumulator = 0;
          } else {
            this.accumulator = 0;
          }

          // 渲染频率跟随显示器；逻辑速度始终不受刷新率影响。
          this.game.render();
          requestAnimationFrame(this.tick);
        }
      }

      // ============================================================
      // 13. Bootstrap
      // ============================================================
      const canvas = document.getElementById("gameCanvas");
      const input = new InputManager(canvas);
      const game = new Game(canvas, input);
      const gameLoop = new GameLoop(game);
      gameLoop.start();

      // 暴露只读调试入口，便于在控制台快速微调或自动化验收。
      window.SPLAT_2D = {
        game,
        loop: gameLoop,
        config: CONFIG
      };
    })();
  </script>
